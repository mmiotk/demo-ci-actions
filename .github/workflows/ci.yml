name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main] 
  workflow_dispatch:
    inputs: 
      run_build:
        description: 'Run build job?'
        required: false
        type: boolean
        default: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run linter
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run test
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build application
        run: npm run build
      - name: Verify build
        run: | 
          ls -la dist
          echo "Build artifact ready"
      - name: Show version
        run: |
          echo "Version ${{needs.version.outputs.app_version}}"
          echo "Version ${{needs.version.outputs.short_sha}}"

  version:
    name: Version 
    runs-on: ubuntu-latest
    outputs: 
      app_version: ${{steps.ver.outputs.version}}
      short_sha: ${{steps.ver.outputs.sha}}
    steps:
      - id: ver
        run: |
          echo "version=1.0.0" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT